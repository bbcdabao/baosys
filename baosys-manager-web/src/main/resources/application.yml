server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: baosys-manager-web
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: baosys-manager
              uri: ${MANAGER_SERVICE_URL:http://127.0.0.1:9090}
              predicates:
                - Path=/api/baosys-manager/**
              filters:
                - StripPrefix=1
            - id: baosys-plant
              uri: ${PLANT_SERVICE_URL:http://127.0.0.1:9091}
              predicates:
                - Path=/api/baosys-plant/**
              filters:
                - StripPrefix=1

    # 启用 Nacos 服务发现时：
    # 1. 放开 pom.xml 中的 Nacos Discovery 依赖。
    # 2. 放开下面的 nacos 配置。
    # 3. 配置 MANAGER_SERVICE_URL=lb://baosys-manager、
    #    PLANT_SERVICE_URL=lb://baosys-plant。
    # nacos:
    #   discovery:
    #     server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    #     namespace: ${NACOS_NAMESPACE:}
    #     group: ${NACOS_GROUP:DEFAULT_GROUP}
    #     username: ${NACOS_USERNAME:nacos}
    #     password: ${NACOS_PASSWORD:nacos}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
          cache-public: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only

szs:
  security:
    jwt:
      issuer: ${SZS_JWT_ISSUER:szs-auth-server}
      public-key: |
        
    access-token-cookie-name: access_token
    permissions-claim-name: permissions
    authority-prefix: ""
    gateway:
      csrf:
        enabled: ${GATEWAY_CSRF_ENABLED:false}
        cookie-name: BAOSYS_CSRF_TOKEN
      permit-all-paths:
        - /api/baosys-manager/v1/auth/login
        - /api/baosys-manager/v1/auth/refresh
        - /api/baosys-manager/v1/auth/logout
        - /actuator/health/**
        - /actuator/info
