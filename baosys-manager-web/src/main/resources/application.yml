server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  security:
    gateway:
      access-rules:
        # 全局共享接口：省略 permission 表示仅要求登录，须放在子系统规则之前。
        - path: /api/baosys-manager/v1/users/me
        - path: /api/baosys-manager/v1/systems
        - path: /api/baosys-manager/**
          permission: MGR
      permit-all-paths:
        - /api/baosys-manager/v1/browser-auth/**
        - /actuator/health/**
        - /actuator/info
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:baosys-manager}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://127.0.0.1:9090/baosys-manager/oauth2/jwks}
          jws-algorithms: [RS256]
          audiences: [def]
  application:
    name: baosys-manager-web
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: baosys-manager
              uri: ${MANAGER_SERVICE_URL:http://127.0.0.1:9090}
              predicates:
                - Path=/api/baosys-manager/**
              filters:
                - StripPrefix=1

    # 启用 Nacos 服务发现时：
    # 1. 放开 pom.xml 中的 Nacos Discovery 依赖。
    # 2. 放开下面的 nacos 配置。
    # 3. 配置 MANAGER_SERVICE_URL=lb://baosys-manager。
    # nacos:
    #   discovery:
    #     server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    #     namespace: ${NACOS_NAMESPACE:}
    #     group: ${NACOS_GROUP:DEFAULT_GROUP}
    #     username: ${NACOS_USERNAME:nacos}
    #     password: ${NACOS_PASSWORD:nacos}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
          cache-public: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
