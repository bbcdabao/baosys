spring:
  security:
    oauth2:
      client:
        provider:
          baosys:
            issuer-uri: ""
        registration:
          baosys:
            client-secret: test-secret
      resourceserver:
        jwt:
          issuer-uri: auth-server
          jwk-set-uri: ""
          public-key-location: classpath:test-public.pem
          jws-algorithms: [RS256]
          audiences: [def]
