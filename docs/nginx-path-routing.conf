# Include inside the deployment's TLS server block; replace upstream addresses.
location = /baosys-manager {
    return 308 /baosys-manager/$is_args$args;
}
location /baosys-manager/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/baosys-manager/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
