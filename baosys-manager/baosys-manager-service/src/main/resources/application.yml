server:
  port: ${MANAGER_PORT:9090}
  shutdown: graceful
  servlet:
    # 服务直连路径携带微服务名；Controller 只维护版本和资源路径。
    context-path: ${MANAGER_CONTEXT_PATH:/baosys-manager}

spring:
  application:
    name: baosys-manager
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123456}
    hikari:
      # 业务连接与 Flyway 使用同一个独立 schema，避免与其他微服务共享 public。
      schema: ${MANAGER_DB_SCHEMA:manager}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${MANAGER_DB_SCHEMA:manager}
    schemas: ${MANAGER_DB_SCHEMA:manager}
    locations: classpath:db/migration
    table: flyway_schema_history_manager

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

auth:
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  # 配置为 0 时不输出 Max-Age，Cookie 在浏览器会话结束时清除。
  access-token-cookie-max-age-seconds: ${AUTH_ACCESS_TOKEN_COOKIE_MAX_AGE_SECONDS:1800}
  refresh-token-cookie-max-age-seconds: ${AUTH_REFRESH_TOKEN_COOKIE_MAX_AGE_SECONDS:2592000}
  refresh-token-cookie-path: ${AUTH_REFRESH_TOKEN_COOKIE_PATH:/api/baosys-manager/v1/auth}
  # 生产安全默认值：不自动创建具有全部 Manager 权限的账号。
  default-admin-enabled: ${DEFAULT_ADMIN_ENABLED:false}
  default-admin-username: ${DEFAULT_ADMIN_USERNAME:admin}
  # 启用初始化时必须由外部环境提供至少 12 位的唯一密码。
  default-admin-password: ${DEFAULT_ADMIN_PASSWORD:}
  refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:30}
common:
  password:
    enabled: true
    strength: 10
security:
  jwt:
    issuer: ${JWT_ISSUER:auth-server}
    # 权限或账号状态变化会立即撤销 Refresh Session；短期 Access Token 将最长撤权延迟限制为 30 分钟。
    access-token-expire-seconds: ${ACCESS_TOKEN_EXPIRE_SECONDS:1800}
    private-key: |
      
    public-key: |
      
  access-token-cookie-name: access_token
  permissions-claim-name: permissions
  authority-prefix: ""
  gateway:
    csrf:
      enabled: ${GATEWAY_CSRF_ENABLED:false}
      cookie-name: BAOSYS_CSRF_TOKEN
  resource:
    permit-all-paths:
      - /v1/auth/login
      - /v1/auth/refresh
      - /v1/auth/logout
      - /actuator/health/**
      - /actuator/info
      - /swagger-ui/**
      - /v3/api-docs/**
