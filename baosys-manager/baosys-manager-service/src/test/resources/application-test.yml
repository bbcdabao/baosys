spring:
  flyway:
    enabled: true

auth:
  default-admin-enabled: true
  default-admin-username: admin
  default-admin-password: Admin123!test
  refresh-token-expire-days: 30
common:
  password:
    strength: 4
security:
  jwt:
    issuer: auth-server
    access-token-expire-seconds: 1800
    private-key: 
    public-key: 
  access-token-cookie-name: access_token
  permissions-claim-name: permissions
